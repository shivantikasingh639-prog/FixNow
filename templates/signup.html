<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixNow - Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="login-body">

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="login-left">

            <div class="brand-logo">
                FIX<span>NOW</span>
            </div>

            <h1>Join FixNow<br>Today!</h1>

            <p>
                Create your account to book trusted technicians
                and reliable home services.
            </p>

            <div class="login-features">

                <div class="feature">
                    <span>✓</span>
                    <p>Easy Service Booking</p>
                </div>

                <div class="feature">
                    <span>✓</span>
                    <p>Trusted Technicians</p>
                </div>

                <div class="feature">
                    <span>✓</span>
                    <p>Quick & Reliable Services</p>
                </div>

            </div>

        </div>

        <!-- RIGHT SIDE -->
        <div class="login-right">

            <div class="login-form-box">

                <h2>Create Account</h2>

                <p class="login-subtitle">
                    Register to get started with FixNow
                </p>

                <form action="{{ url_for('signup') }}" method="POST">

                    <label for="name">Full Name *</label>

                    <div class="input-box">
                        <span>👤</span>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required>
                    </div>

                    <label for="email">Email Address *</label>

                    <div class="input-box">
                        <span>✉</span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required>
                    </div>

                    <label for="password">Create Password *</label>

                    <div class="input-box">
                        <span>🔒</span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Minimum 8 characters"
                            minlength="8"
                            autocomplete="new-password"
                            required>
                    </div>

                    <label for="confirm_password">Confirm Password *</label>

                    <div class="input-box">
                        <span>🔒</span>
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Re-enter your password"
                            minlength="8"
                            autocomplete="new-password"
                            required>
                    </div>

                    <button type="submit" class="main-login-btn">
                        Create Account
                    </button>

                </form>

                <p class="create-account">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Login</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
